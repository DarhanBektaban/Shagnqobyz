<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Виртуалды Шаңқобыз</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1612;
    color: #e5c158;
    font-family: sans-serif;
    user-select: none;
    touch-action: none;
  }
  #pad {
    width: 90vw;
    height: 60vh;
    border: 2px dashed #e5c158;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-align: center;
    padding: 20px;
  }
</style>
</head>
<body>

<div id="pad">Басу немесе шерту: Тілшені қағу<br>Жоғары/төмен жылжыту: Обертон (ауыз қуысы)</div>

<script>
let ctx = null;
const baseFreq = 65.4; // C2 нотасы (шаңқобыздың негізгі бурдон тоны)

function initAudio() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
}

function pluck(yPercent) {
  initAudio();
  if (ctx.state === 'suspended') ctx.resume();

  const now = ctx.currentTime;
  const duration = 2.2; // Тілшенің тербелу ұзақтығы

  // 1. Тілше дірілінің генераторы (бай гармоникалық ара тәрізді толқын)
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(baseFreq, now);

  // Тілшені қаққан кездегі жеңіл pitch-bend әсері
  osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.1, now + 0.02);
  osc.frequency.exponentialRampToValueAtTime(baseFreq, now + 0.15);

  // 2. Ауыз қуысының резонансы (Bandpass фильтр - формант)
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.Q.value = 14; // Резонанс өткірлігі

  // Төменнен жоғарыға: 300 Гц - 2600 Гц арасындағы обертондар
  const formantFreq = 300 + (1 - yPercent) * 2300;
  filter.frequency.setValueAtTime(formantFreq, now);

  // 3. Тілшенің өшу динамикасы (ADSR)
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(1.0, now + 0.005); // Шапшаң соққы (attack)
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

  // Тізбекті қосу
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);

  osc.start(now);
  osc.stop(now + duration);
}

const pad = document.getElementById('pad');

function handleInteraction(e) {
  const rect = pad.getBoundingClientRect();
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  let y = (clientY - rect.top) / rect.height;
  y = Math.max(0, Math.min(1, y));
  pluck(y);
}

pad.addEventListener('pointerdown', handleInteraction);
pad.addEventListener('pointermove', (e) => {
  if (e.buttons === 1) handleInteraction(e);
});
</script>
</body>
</html>
